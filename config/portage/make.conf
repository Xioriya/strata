COMMON_FLAGS="-O2 -pipe -march=x86-64-v2"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j$(nproc) -l$(nproc)"
FEATURES="parallel-fetch parallel-install binpkg-multi-instance clean-logs"
ACCEPT_KEYWORDS="amd64"
USE="dbus elogind policykit wayland zstd lz4 threads"

GRUB_PLATFORMS="efi-64"
